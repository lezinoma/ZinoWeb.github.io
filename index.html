<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6f91">
  <meta name="description" content="Find me on social media.">
  <title>My Socials</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171326;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, rgb(255 74 136 / 75%), transparent 38%),
        radial-gradient(ellipse at 88% 20%, rgb(255 91 55 / 70%), transparent 36%),
        radial-gradient(ellipse at 18% 88%, rgb(54 117 255 / 70%), transparent 38%),
        radial-gradient(ellipse at 86% 85%, rgb(255 153 48 / 72%), transparent 40%),
        #171326;
    }

    .card {
      width: min(100%, 470px);
      padding: 42px 30px 30px;
      text-align: center;
      border: 1px solid rgb(255 255 255 / 25%);
      border-radius: 30px;
      background: rgb(24 20 41 / 72%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      backdrop-filter: blur(18px);
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 3px solid rgb(255 255 255 / 80%);
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6f91, #ff9651 48%, #5685ff);
      font-size: 38px;
      box-shadow: 0 8px 30px rgb(255 111 145 / 35%);
    }

    h1 { margin: 0; font-size: clamp(2rem, 8vw, 2.7rem); letter-spacing: -0.05em; }
    .intro { margin: 10px 0 28px; color: rgb(255 255 255 / 75%); line-height: 1.6; }

    .links { display: grid; gap: 12px; }

    .social-link {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 16px;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
      background: rgb(255 255 255 / 9%);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .social-link:hover, .social-link:focus-visible {
      transform: translateY(-2px);
      border-color: rgb(255 255 255 / 60%);
      background: rgb(255 255 255 / 17%);
      outline: none;
    }

    .social-link span:last-child { color: rgb(255 255 255 / 70%); font-size: 1.2rem; }
    footer { margin-top: 24px; color: rgb(255 255 255 / 55%); font-size: 0.85rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">✨</div>
    <h1>My Socials</h1>
    <p class="intro">Hey! Find me around the internet 👋</p>

    <nav class="links" aria-label="Social media links">
      <a class="social-link" href="https://www.instagram.com/tgg_zino" target="_blank" rel="noopener noreferrer"><span>📸 &nbsp; Instagram</span><span aria-hidden="true">↗</span></a>
      <a class="social-link" href="https://www.youtube.com/@Zinomaroll1" target="_blank" rel="noopener noreferrer"><span>🎵 &nbsp; YouTube</span><span aria-hidden="true">↗</span></a>
      <a class="social-link" href="https://www.youtube.com/@ZinomaVODs" target="_blank" rel="noopener noreferrer"><span>▶️ &nbsp; YouTube VODs</span><span aria-hidden="true">↗</span></a>
      <a class="social-link" href="https://www.youtube.com/@tgg_zino" target="_blank" rel="noopener noreferrer"><span>💬 &nbsp; YouTube (secondary)</span><span aria-hidden="true">↗</span></a>
      <a class="social-link" href="https://kick.com/lezinoma" target="_blank" rel="noopener noreferrer"><span>🌐 &nbsp; Kick</span><span aria-hidden="true">↗</span></a>
    </nav>

  </main>
</body>
</html>
